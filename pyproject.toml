[project]
name = "ajb-demo"
version = "1.0.0"
description = "Python build and documentation tools for the adaptive jitter-buffer demo"
requires-python = ">=3.11"
dependencies = ["conan==2.28.1"]

[dependency-groups]
docs = [
    "Sphinx==8.2.3",
    "myst-parser==4.0.1",
]
web = [
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false
